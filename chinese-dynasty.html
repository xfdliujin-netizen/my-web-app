    /********************************************************************
     * 4. 连续无级比例尺引擎 (支持 20% ~ 220% 平滑缩放，80% 为事件展开/折叠阈值)
     ********************************************************************/
    const TIME_SEGMENTS = [
      { start: -2100, end: -770, basePxPerYear: 0.44 }, // 夏商西周
      { start: -770,  end: -221, basePxPerYear: 1.40 }, // 春秋战国
      { start: -221,  end: 220,  basePxPerYear: 1.90 }, // 秦汉
      { start: 220,   end: 589,  basePxPerYear: 3.70 }, // 三国、两晋十六国、南北朝
      { start: 589,   end: 907,  basePxPerYear: 2.35 }, // 隋唐
      { start: 907,   end: 979,  basePxPerYear: 5.60 }, // 五代十国
      { start: 979,   end: 1368, basePxPerYear: 2.45 }, // 宋辽夏金元
      { start: 1368,  end: 1920, basePxPerYear: 2.40 }  // 明清至民初
    ];

    const BASE_LEFT_PADDING = 220;
    const BASE_RIGHT_PADDING = 240;

    const MIN_SCALE = 0.20;  // 最低可缩放到 20%，一屏统筹中华上下五千年全貌
    const MAX_SCALE = 2.20;  // 最高可放大到 220%，精细查看密集政权与事件
    const EVENT_UNFOLD_THRESHOLD = 0.80; // 80% 阈值：>=80% 呈现事件，<80% 柔和折叠

    let state = {
      zoomScale: 1.00,       // 当前实时缩放比 (1.00 = 100%, 最低 0.20 = 20%)
      scrollX: 0,
      showEventsMaster: true,// 下方总开关是否开启
      activeCategory: 'all',
      selectedEventId: 'e15',
      activeDynastyId: 'sanguo',
      activeSubId: 'caowei',
      isDragging: false,
      dragStartX: 0,
      dragStartScrollX: 0,
      velocityX: 0,
      lastMoveTime: 0,
      lastMoveX: 0,
      rafId: null,
      zoomAnimId: null
    };

    function getLeftPadding(customScale = state.zoomScale) {
      return Math.max(48, Math.round(BASE_LEFT_PADDING * Math.min(1, customScale + 0.15)));
    }

    function getRightPadding(customScale = state.zoomScale) {
      return Math.max(48, Math.round(BASE_RIGHT_PADDING * Math.min(1, customScale + 0.15)));
    }

    // 年份 -> 画布X坐标转换（根据连续 zoomScale 计算）
    function yearToX(year, customScale = state.zoomScale) {
      let x = getLeftPadding(customScale);
      for (const seg of TIME_SEGMENTS) {
        if (year <= seg.start) break;
        const clampedEnd = Math.min(year, seg.end);
        const span = clampedEnd - seg.start;
        if (span > 0) {
          x += span * seg.basePxPerYear * customScale;
        }
      }
      return x;
    }

    // 画布X坐标 -> 年份逆转换
    function xToYear(x, customScale = state.zoomScale) {
      let rem = x - getLeftPadding(customScale);
      if (rem <= 0) return TIME_SEGMENTS[0].start;
      for (const seg of TIME_SEGMENTS) {
        const segWidth = (seg.end - seg.start) * seg.basePxPerYear * customScale;
        if (rem <= segWidth) {
          return Math.round(seg.start + rem / (seg.basePxPerYear * customScale));
        }
        rem -= segWidth;
      }
      return TIME_SEGMENTS[TIME_SEGMENTS.length - 1].end;
    }

    function getTotalCanvasWidth(customScale = state.zoomScale) {
      return yearToX(1920, customScale) + getRightPadding(customScale);
    }

    function formatYearStr(year) {
      return year < 0 ? `前${Math.abs(year)}年` : `公元${year}年`;
    }

    /********************************************************************
     * 5. DOM 引用与缓存式高性能构建
     ********************************************************************/
    const viewportEl = document.getElementById('timeline-viewport');
    const canvasEl = document.getElementById('timeline-canvas');
    const ticksLayer = document.getElementById('ticks-layer');
    const macroLayer = document.getElementById('macro-dynasty-layer');
    const subLayer = document.getElementById('sub-regime-layer');
    const eventsLayer = document.getElementById('events-layer');
    const quickNavEl = document.getElementById('dynasty-quick-nav');
    const centerEraBadge = document.getElementById('center-era-badge');
    const centerYearDisplay = document.getElementById('center-year-display');
    const zoomLabelEl = document.getElementById('zoom-label');
    const eventStatusPill = document.getElementById('event-status-pill');

    const domCache = {
      ticks: [],
      macros: [],
      subs: [],
      events: []
    };

    const TICK_YEARS = [
      -2070, -1600, -1300, -1046, -770, -500, -350, -221, -100, 1, 100,
      220, 280, 317, 383, 420, 494, 534, 589, 618, 700, 755, 820, 907,
      960, 1038, 1127, 1206, 1271, 1368, 1450, 1550, 1644, 1735, 1840, 1912
    ];

    // 渲染顶部可左右滑动的全部16个朝代导航按钮
    function renderQuickNav() {
      quickNavEl.innerHTML = '';
      MACRO_DYNASTIES.forEach(dyn => {
        const btn = document.createElement('button');
        btn.dataset.dynId = dyn.id;
        btn.className = `dyn-nav-pill shrink-0 px-2.5 py-1 rounded text-xs font-black transition border ${
          state.activeDynastyId === dyn.id
            ? 'bg-[#B8332A] text-[#FAF6EE] border-[#8E241D] shadow-sm'
            : 'bg-[#FAF6EE] text-[#1E1B18] border-[#C9B99B] hover:bg-[#EFE6D5]'
        }`;
        btn.textContent = dyn.name.replace('(春秋战国)', '');
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeDynastyId = dyn.id;
          const midYear = Math.round((dyn.start + dyn.end) / 2);
          centerOnYear(midYear, true);
          showDynastyDetail(dyn, '大朝代总览');
          updateActiveHighlights();
          scrollActiveNavIntoView(dyn.id);
        });
        quickNavEl.appendChild(btn);
      });
    }

    function scrollActiveNavIntoView(dynId) {
      const targetBtn = quickNavEl.querySelector(`[data-dyn-id="${dynId}"]`);
      if (!targetBtn) return;
      const navRect = quickNavEl.getBoundingClientRect();
      const btnRect = targetBtn.getBoundingClientRect();
      const offset = (btnRect.left - navRect.left) - (navRect.width / 2) + (btnRect.width / 2);
      quickNavEl.scrollBy({ left: offset, behavior: 'smooth' });
    }

    function initNavDragScroll() {
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;

      quickNavEl.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - quickNavEl.offsetLeft;
        scrollLeft = quickNavEl.scrollLeft;
      });
      window.addEventListener('mouseup', () => { isDown = false; });
      quickNavEl.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - quickNavEl.offsetLeft;
        quickNavEl.scrollLeft = scrollLeft - (x - startX) * 1.5;
      });

      document.getElementById('nav-scroll-left').addEventListener('click', () => {
        quickNavEl.scrollBy({ left: -180, behavior: 'smooth' });
      });
      document.getElementById('nav-scroll-right').addEventListener('click', () => {
        quickNavEl.scrollBy({ left: 180, behavior: 'smooth' });
      });
    }

    // 首次创建画布内所有节点
    function buildCanvasElementsOnce() {
      // 1. 刻度线
      ticksLayer.innerHTML = '';
      domCache.ticks = TICK_YEARS.map(yr => {
        const tick = document.createElement('div');
        tick.className = 'absolute top-0 flex flex-col items-center -translate-x-1/2';
        tick.innerHTML = `
          <span class="text-[10px] font-bold text-[#6E6254] font-mono leading-none mt-1">${yr < 0 ? '前' + Math.abs(yr) : yr}</span>
          <div class="w-[1px] h-2 bg-[#A89882] mt-0.5"></div>
        `;
        ticksLayer.appendChild(tick);
        return { yr, el: tick };
      });

      // 2. 大朝代块
      macroLayer.innerHTML = '';
      domCache.macros = MACRO_DYNASTIES.map(dyn => {
        const block = document.createElement('div');
        block.dataset.dynId = dyn.id;
        block.className = 'macro-dynasty-block pointer-events-auto';
        block.style.backgroundColor = dyn.bg;
        block.style.border = `2px solid ${dyn.color}`;

        const nameEl = document.createElement('div');
        nameEl.className = 'font-black tracking-wide leading-tight truncate max-w-full';
        nameEl.style.color = dyn.color;
        nameEl.textContent = dyn.name;

        const periodEl = document.createElement('div');
        periodEl.className = 'mt-0.5 px-1.5 py-[1px] rounded text-[10px] font-bold text-[#FAF6EE] leading-tight truncate max-w-full';
        periodEl.style.backgroundColor = dyn.color;
        periodEl.textContent = dyn.period;

        block.appendChild(nameEl);
        block.appendChild(periodEl);

        block.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeDynastyId = dyn.id;
          state.activeSubId = null;
          state.selectedEventId = null;
          showDynastyDetail(dyn, '朝代总览');
          updateActiveHighlights();
          scrollActiveNavIntoView(dyn.id);
        });

        macroLayer.appendChild(block);
        return { dyn, el: block, nameEl, periodEl };
      });

      // 3. 细分政权块
      subLayer.innerHTML = '';
      const sortedSubs = [...SUB_REGIMES].sort((a, b) => a.start - b.start);
      domCache.subs = sortedSubs.map(sub => {
        const el = document.createElement('div');
        el.dataset.subId = sub.id;
        el.className = 'sub-regime-block pointer-events-auto';
        el.style.backgroundColor = sub.color;
        el.style.color = '#FAF6EE';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'font-black leading-none truncate max-w-full';
        nameSpan.textContent = sub.name;

        const periodSpan = document.createElement('span');
        periodSpan.className = 'font-bold leading-none truncate max-w-full';
        periodSpan.textContent = sub.period;

        el.appendChild(nameSpan);
        el.appendChild(periodSpan);

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          state.activeSubId = sub.id;
          state.selectedEventId = null;
          showDynastyDetail(sub, '细分政权 / 并立国家');
          updateActiveHighlights();
        });

        subLayer.appendChild(el);
        return { sub, el, nameSpan, periodSpan };
      });

      // 4. 重大历史事件竹简节点
      buildHistoricalEventElements();
    }

    function buildHistoricalEventElements() {
      eventsLayer.innerHTML = '';
      const catColorMap = {
        '政治变革': '#B8332A',
        '军事风云': '#2F4F6F',
        '文明盛世': '#9E6224',
        '对外开拓': '#2E6E5E'
      };

      const filtered = HISTORICAL_EVENTS.filter(ev =>
        state.activeCategory === 'all' || ev.category === state.activeCategory
      );

      domCache.events = filtered.map(ev => {
        const dotColor = catColorMap[ev.category] || '#B8332A';
        const isSelected = state.selectedEventId === ev.id;
        const shortYear = ev.year < 0 ? `前${Math.abs(ev.year)}` : `${ev.year}`;

        const node = document.createElement('div');
        node.dataset.eventId = ev.id;
        node.className = `event-node pointer-events-auto ${isSelected ? 'selected' : ''}`;
        node.style.top = `198px`; // 锚定在 204px 事件基线上

        node.innerHTML = `
          <div class="flex flex-col items-center">
            <!-- 轴上圆点 -->
            <div class="pulse-circle relative w-3.5 h-3.5 rounded-full border-2 border-[#FAF6EE] shadow"
                 style="background-color: ${dotColor};"></div>
            <!-- 柔和展开/折叠包装容器 -->
            <div class="slip-fold-wrapper">
              <div class="stem-line w-[1.5px] transition-all duration-300" style="background-color: ${dotColor}; opacity: 0.65;"></div>
              <div class="vertical-bamboo-slip">
                <span class="slip-year" style="background-color:${dotColor}18; color:${dotColor};">${shortYear}</span>
                <span class="slip-title">${ev.shortTitle}</span>
              </div>
            </div>
          </div>
        `;

        const stemEl = node.querySelector('.stem-line');

        node.addEventListener('click', (e) => {
          e.stopPropagation();
          // 若当前处于 <80% 折叠态，点击圆点时自动柔和放大至 100% 展开事件并展示详情
          if (state.zoomScale < EVENT_UNFOLD_THRESHOLD) {
            animateZoomTo(1.00, ev.year);
          }
          selectHistoricalEvent(ev.id, true);
        });

        eventsLayer.appendChild(node);
        return { ev, el: node, stemEl };
      });
    }

    // 根据当前 state.zoomScale (0.20 ~ 2.20) 实时更新所有元素的坐标与宽度，并联动 80% 阈值折叠动画
    function updateCanvasLayout() {
      const totalW = getTotalCanvasWidth();
      canvasEl.style.width = `${totalW}px`;

      // 更新顶部百分比读数
      const pct = Math.round(state.zoomScale * 100);
      zoomLabelEl.textContent = `${pct}%`;
      zoomLabelEl.className = `text-[10px] font-black px-1.5 font-mono min-w-[38px] text-center transition-colors ${
        state.zoomScale >= EVENT_UNFOLD_THRESHOLD ? 'text-[#B8332A]' : 'text-[#6E6254]'
      }`;

      // 1) 更新刻度位置
      const minTickGap = 34;
      let lastTickX = -9999;
      domCache.ticks.forEach(({ yr, el }) => {
        const x = yearToX(yr);
        el.style.left = `${x}px`;
        if (x - lastTickX < minTickGap) {
          el.style.opacity = '0';
        } else {
          el.style.opacity = '1';
          lastTickX = x;
        }
      });

      // 2) 更新大朝代位置与自适应简称（兼容 20% 极小全景缩放）
      let prevMacroRight = -9999;
      domCache.macros.forEach(({ dyn, el, nameEl, periodEl }) => {
        let x1 = yearToX(dyn.start);
        const x2 = yearToX(dyn.end);
        if (x1 < prevMacroRight + 1.5) x1 = prevMacroRight + 1.5;
        const minW = Math.max(16, Math.round(44 * state.zoomScale));
        const width = Math.max(x2 - x1 - 1.5, minW);
        prevMacroRight = x1 + width;

        el.style.left = `${x1}px`;
        el.style.width = `${width}px`;

        if (width < 36) {
          nameEl.textContent = dyn.shortName || dyn.name;
          nameEl.style.fontSize = '11px';
          periodEl.style.display = 'none';
        } else if (width < 64) {
          nameEl.textContent = dyn.shortName || dyn.name;
          nameEl.style.fontSize = '13px';
          periodEl.style.display = 'none';
        } else if (width < 94) {
          nameEl.textContent = dyn.name;
          nameEl.style.fontSize = '14px';
          periodEl.style.display = 'block';
        } else {
          nameEl.textContent = dyn.name;
          nameEl.style.fontSize = '16px';
          periodEl.style.display = 'block';
        }
      });

      // 3) 更新三轨细分政权位置（支持 20% 全景比例下自动切换简写）
      const trackTops = [84, 122, 160];
      const trackLastRight = [-9999, -9999, -9999];
      domCache.subs.forEach(({ sub, el, nameSpan, periodSpan }) => {
        const t = sub.track || 0;
        let x1 = yearToX(sub.start);
        const x2 = yearToX(sub.end);
        if (x1 < trackLastRight[t] + 1.5) x1 = trackLastRight[t] + 1.5;
        const minSubW = Math.max(14, Math.round(50 * state.zoomScale));
        const width = Math.max(x2 - x1 - 1.5, minSubW);
        trackLastRight[t] = x1 + width;

        el.style.left = `${x1}px`;
        el.style.top = `${trackTops[t]}px`;
        el.style.width = `${width}px`;

        if (width < 32) {
          el.className = 'sub-regime-block pointer-events-auto flex-col';
          nameSpan.textContent = sub.shortName || sub.name.slice(0, 2);
          nameSpan.className = 'text-[10px] font-black leading-none truncate max-w-full';
          periodSpan.style.display = 'none';
        } else if (width < 60) {
          el.className = 'sub-regime-block pointer-events-auto flex-col';
          nameSpan.textContent = sub.shortName || sub.name;
          nameSpan.className = 'text-[11px] font-black leading-none truncate max-w-full';
          periodSpan.style.display = 'none';
        } else if (width < 112) {
          el.className = 'sub-regime-block pointer-events-auto flex-col';
          nameSpan.textContent = sub.name;
          nameSpan.className = 'text-[12px] font-black leading-none truncate max-w-full';
          periodSpan.style.display = 'inline';
          periodSpan.className = 'text-[9px] font-bold opacity-90 leading-none mt-0.5 truncate max-w-full';
        } else {
          el.className = 'sub-regime-block pointer-events-auto gap-1.5';
          nameSpan.textContent = sub.name;
          nameSpan.className = 'text-[13px] font-black leading-none truncate';
          periodSpan.style.display = 'inline';
          periodSpan.className = 'text-[10px] font-bold px-1 py-[1px] rounded bg-black/25 leading-none shrink-0';
        }
      });

      // 4) 更新重大历史事件位置 & 80% 缩放阈值自动展开/折叠控制
      const isFoldedByZoom = state.zoomScale < EVENT_UNFOLD_THRESHOLD;
      const rowLastRight = [-9999, -9999];
      const rowStemHeights = [8, 24];
      const slipWidth = 28;

      domCache.events.forEach(({ ev, el, stemEl }) => {
        const x = yearToX(ev.year);
        const halfW = slipWidth / 2;

        let chosenRow = 0;
        if (x - halfW < rowLastRight[0] + 4) {
          chosenRow = 1;
        }
        rowLastRight[chosenRow] = x + halfW;

        el.style.left = `${x}px`;
        stemEl.style.height = `${rowStemHeights[chosenRow]}px`;

        el.classList.toggle('hidden-by-switch', !state.showEventsMaster);
        el.classList.toggle('folded-by-zoom', state.showEventsMaster && isFoldedByZoom);
      });

      updateEventStatusBadge();
      updateActiveHighlights();
    }

    function updateEventStatusBadge() {
      const isFoldedByZoom = state.zoomScale < EVENT_UNFOLD_THRESHOLD;
      if (!state.showEventsMaster) {
        eventStatusPill.textContent = '已关闭';
        eventStatusPill.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#A89882]/30 text-[#524B42] transition-colors';
      } else if (isFoldedByZoom) {
        eventStatusPill.textContent = '已折叠 (<80%)';
        eventStatusPill.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#B8863B]/20 text-[#8C5818] transition-colors';
      } else {
        eventStatusPill.textContent = `展开 (${domCache.events.length})`;
        eventStatusPill.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#B8332A]/15 text-[#B8332A] transition-colors';
      }
    }

    /********************************************************************
     * 6. 详情卡片联动
     ********************************************************************/
    function selectHistoricalEvent(eventId, centerView = false) {
      const ev = HISTORICAL_EVENTS.find(item => item.id === eventId);
      if (!ev) return;

      state.selectedEventId = ev.id;
      state.activeSubId = null;

      const matchedDyn = MACRO_DYNASTIES.find(d => ev.year >= d.start && ev.year <= d.end);
      if (matchedDyn) {
        state.activeDynastyId = matchedDyn.id;
        scrollActiveNavIntoView(matchedDyn.id);
      }

      animateDetailContentUpdate(() => {
        document.getElementById('detail-badge-type').textContent = ev.category;
        document.getElementById('detail-dynasty-tag').textContent = ev.period;
        document.getElementById('detail-year-tag').textContent = formatYearStr(ev.year);
        document.getElementById('detail-title').textContent = ev.title;
        document.getElementById('detail-figure').textContent = `风云人物：${ev.figure}`;
        document.getElementById('detail-desc').textContent = ev.desc;
        document.getElementById('detail-extended-text').textContent = ev.detail || ev.desc;
        document.getElementById('detail-impact').textContent = ev.impact;
        document.getElementById('detail-scroll-container').scrollTop = 0;
      });

      if (centerView) {
        centerOnYear(ev.year, true);
      }
      updateActiveHighlights();
    }

    function showDynastyDetail(item, badgeLabel) {
      animateDetailContentUpdate(() => {
        document.getElementById('detail-badge-type').textContent = badgeLabel;
        document.getElementById('detail-dynasty-tag').textContent = item.name;
        document.getElementById('detail-year-tag').textContent = item.period;
        document.getElementById('detail-title').textContent = `${item.name}（${item.period}）`;
        document.getElementById('detail-figure').textContent = `开创者 / 代表：${item.founder}${item.capital ? ' · 都城：' + item.capital : ''}`;
        document.getElementById('detail-desc').textContent = item.desc;
        document.getElementById('detail-extended-text').textContent = item.detail || item.desc;
        document.getElementById('detail-impact').textContent = item.impact;
        document.getElementById('detail-scroll-container').scrollTop = 0;
      });
    }

    function animateDetailContentUpdate(updaterFn) {
      const container = document.getElementById('detail-scroll-container');
      container.classList.add('detail-fade-out');
      setTimeout(() => {
        updaterFn();
        container.classList.remove('detail-fade-out');
      }, 110);
    }

    function updateActiveHighlights() {
      document.querySelectorAll('.dyn-nav-pill').forEach(btn => {
        const active = btn.dataset.dynId === state.activeDynastyId;
        btn.className = `dyn-nav-pill shrink-0 px-2.5 py-1 rounded text-xs font-black transition border ${
          active
            ? 'bg-[#B8332A] text-[#FAF6EE] border-[#8E241D] shadow-sm'
            : 'bg-[#FAF6EE] text-[#1E1B18] border-[#C9B99B] hover:bg-[#EFE6D5]'
        }`;
      });

      domCache.macros.forEach(({ dyn, el }) => {
        el.classList.toggle('active-dynasty', dyn.id === state.activeDynastyId);
      });

      domCache.subs.forEach(({ sub, el }) => {
        el.classList.toggle('active-sub', sub.id === state.activeSubId);
      });

      domCache.events.forEach(({ ev, el }) => {
        el.classList.toggle('selected', ev.id === state.selectedEventId);
      });
    }

    /********************************************************************
     * 7. 单指惯性滑动 + 双指捏合无级缩放引擎 (20% ~ 220%)
     ********************************************************************/
    function clampScrollX(x) {
      const vw = viewportEl.clientWidth;
      const maxScroll = Math.max(0, getTotalCanvasWidth() - vw);
      return Math.max(0, Math.min(x, maxScroll));
    }

    function applyScrollTransform() {
      state.scrollX = clampScrollX(state.scrollX);
      canvasEl.style.transform = `translate3d(${-state.scrollX}px, 0, 0)`;

      const centerX = state.scrollX + viewportEl.clientWidth / 2;
      const curYear = xToYear(centerX);
      centerYearDisplay.textContent = formatYearStr(curYear);

      const curDyn = MACRO_DYNASTIES.find(d => curYear >= d.start && curYear <= d.end);
      if (curDyn) {
        centerEraBadge.textContent = curDyn.name.replace('(春秋战国)', '');
      }
    }

    // 以视口内某一点（默认为视口中心）为锚点调整缩放比例
    function setZoomScaleAnchored(newScale, anchorViewportX = viewportEl.clientWidth / 2) {
      const clampedScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      const anchorCanvasXBefore = state.scrollX + anchorViewportX;
      const anchorYear = xToYear(anchorCanvasXBefore, state.zoomScale);

      state.zoomScale = clampedScale;
      updateCanvasLayout();

      const anchorCanvasXAfter = yearToX(anchorYear, state.zoomScale);
      state.scrollX = clampScrollX(anchorCanvasXAfter - anchorViewportX);
      applyScrollTransform();
    }

    // 柔和缩放动画（用于点击 ＋/－ 按钮或点击折叠态事件圆点）
    function animateZoomTo(targetScale, focusYear = null) {
      if (state.zoomAnimId) cancelAnimationFrame(state.zoomAnimId);

      const startScale = state.zoomScale;
      const clampedTarget = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
      const startTime = performance.now();
      const duration = 360;

      const anchorViewportX = viewportEl.clientWidth / 2;
      const anchorYear = focusYear !== null ? focusYear : xToYear(state.scrollX + anchorViewportX, startScale);

      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        state.zoomScale = startScale + (clampedTarget - startScale) * ease;
        updateCanvasLayout();

        const newX = yearToX(anchorYear, state.zoomScale);
        state.scrollX = clampScrollX(newX - anchorViewportX);
        applyScrollTransform();

        if (t < 1) {
          state.zoomAnimId = requestAnimationFrame(step);
        }
      }
      state.zoomAnimId = requestAnimationFrame(step);
    }

    function centerOnYear(year, smooth = true) {
      if (state.rafId) cancelAnimationFrame(state.rafId);
      const targetX = clampScrollX(yearToX(year) - viewportEl.clientWidth / 2);
      if (!smooth) {
        state.scrollX = targetX;
        applyScrollTransform();
        return;
      }
      const startX = state.scrollX;
      const diff = targetX - startX;
      const startTime = performance.now();
      const duration = 380;

      function step(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - t, 3);
        state.scrollX = startX + diff * ease;
        applyScrollTransform();
        if (t < 1) {
          state.rafId = requestAnimationFrame(step);
        } else {
          const curDyn = MACRO_DYNASTIES.find(d => year >= d.start && year <= d.end);
          if (curDyn) {
            state.activeDynastyId = curDyn.id;
            updateActiveHighlights();
            scrollActiveNavIntoView(curDyn.id);
          }
        }
      }
      state.rafId = requestAnimationFrame(step);
    }

    // 初始化单指拖拽与双指捏合缩放
    function initTimelineTouchAndPinch() {
      const activePointers = new Map();
      let isPinching = false;
      let pinchStartDist = 0;
      let pinchStartScale = 1.0;

      function getPinchDistanceAndCenter() {
        const pts = Array.from(activePointers.values());
        const dx = pts[0].x - pts[1].x;
        const dy = pts[0].y - pts[1].y;
        const dist = Math.hypot(dx, dy);
        const rect = viewportEl.getBoundingClientRect();
        const centerX = (pts[0].x + pts[1].x) / 2 - rect.left;
        return { dist, centerX };
      }

      viewportEl.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button')) return;
        if (state.rafId) cancelAnimationFrame(state.rafId);
        if (state.zoomAnimId) cancelAnimationFrame(state.zoomAnimId);

        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2) {
          isPinching = true;
          state.isDragging = false;
          const { dist } = getPinchDistanceAndCenter();
          pinchStartDist = Math.max(dist, 20);
          pinchStartScale = state.zoomScale;
        } else if (activePointers.size === 1) {
          isPinching = false;
          state.isDragging = true;
          state.dragStartX = e.clientX;
          state.dragStartScrollX = state.scrollX;
          state.velocityX = 0;
          state.lastMoveX = e.clientX;
          state.lastMoveTime = performance.now();
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (activePointers.size === 2 && isPinching) {
          const { dist, centerX } = getPinchDistanceAndCenter();
          const ratio = dist / pinchStartDist;
          const nextScale = pinchStartScale * ratio;
          setZoomScaleAnchored(nextScale, centerX);
          return;
        }

        if (state.isDragging && activePointers.size === 1) {
          const dx = e.clientX - state.dragStartX;
          state.scrollX = state.dragStartScrollX - dx;
          applyScrollTransform();

          const now = performance.now();
          const dt = now - state.lastMoveTime;
          if (dt > 0) {
            state.velocityX = (e.clientX - state.lastMoveX) / dt;
            state.lastMoveX = e.clientX;
            state.lastMoveTime = now;
          }
        }
      });

      function onPointerUpOrCancel(e) {
        activePointers.delete(e.pointerId);

        if (isPinching && activePointers.size < 2) {
          isPinching = false;
          if (activePointers.size === 1) {
            const remaining = Array.from(activePointers.values())[0];
            state.isDragging = true;
            state.dragStartX = remaining.x;
            state.dragStartScrollX = state.scrollX;
            state.velocityX = 0;
            state.lastMoveX = remaining.x;
            state.lastMoveTime = performance.now();
          } else {
            syncNavAfterScroll();
          }
          return;
        }

        if (state.isDragging && activePointers.size === 0) {
          state.isDragging = false;
          let v = -state.velocityX * 16;
          if (Math.abs(v) > 1.2) {
            function inertia() {
              v *= 0.92;
              state.scrollX += v;
              applyScrollTransform();
              if (Math.abs(v) > 0.5) {
                state.rafId = requestAnimationFrame(inertia);
              } else {
                syncNavAfterScroll();
              }
            }
            state.rafId = requestAnimationFrame(inertia);
          } else {
            syncNavAfterScroll();
          }
        }
      }

      window.addEventListener('pointerup', onPointerUpOrCancel);
      window.addEventListener('pointercancel', onPointerUpOrCancel);

      // 桌面端滚轮：按住 Ctrl/Meta 或触控板捏合为缩放，普通滚轮为左右移动
      viewportEl.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          const rect = viewportEl.getBoundingClientRect();
          const cursorX = e.clientX - rect.left;
          const zoomDelta = -e.deltaY * 0.004;
          setZoomScaleAnchored(state.zoomScale + zoomDelta, cursorX);
        } else {
          state.scrollX += (e.deltaY || e.deltaX) * 0.9;
          applyScrollTransform();
        }
      }, { passive: false });
    }

    function syncNavAfterScroll() {
      const centerX = state.scrollX + viewportEl.clientWidth / 2;
      const curYear = xToYear(centerX);
      const curDyn = MACRO_DYNASTIES.find(d => curYear >= d.start && curYear <= d.end);
      if (curDyn && curDyn.id !== state.activeDynastyId) {
        state.activeDynastyId = curDyn.id;
        updateActiveHighlights();
        scrollActiveNavIntoView(curDyn.id);
      }
    }

    /********************************************************************
     * 8. 控制栏交互绑定
     ********************************************************************/
    function initControls() {
      // 重大历史事件总开关
      const toggleBtn = document.getElementById('toggle-events-btn');
      const toggleKnob = document.getElementById('toggle-knob');
      toggleBtn.addEventListener('click', () => {
        state.showEventsMaster = !state.showEventsMaster;
        toggleBtn.setAttribute('aria-checked', String(state.showEventsMaster));
        toggleBtn.classList.toggle('bg-[#B8332A]', state.showEventsMaster);
        toggleBtn.classList.toggle('bg-[#A89882]', !state.showEventsMaster);
        toggleKnob.classList.toggle('translate-x-5', state.showEventsMaster);
        toggleKnob.classList.toggle('translate-x-0', !state.showEventsMaster);

        // 若用户开启事件总开关，但当前缩放比例小于 80%，自动柔和放大至 100% 让事件呈现
        if (state.showEventsMaster && state.zoomScale < EVENT_UNFOLD_THRESHOLD) {
          animateZoomTo(1.00);
        } else {
          updateCanvasLayout();
        }
      });

      // 分类筛选按钮
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeCategory = btn.dataset.cat;
          document.querySelectorAll('.cat-pill').forEach(b => {
            const active = b.dataset.cat === state.activeCategory;
            b.className = `cat-pill px-2 py-0.5 rounded-full text-[11px] font-bold shrink-0 transition ${
              active ? 'bg-[#1E1B18] text-[#FAF6EE]' : 'bg-[#DCD1BC] text-[#524B42]'
            }`;
          });
          buildHistoricalEventElements();
          updateCanvasLayout();
        });
      });

      // 顶部 ＋ / － 按钮按 20% 步进柔和缩放（最低可至 20%）
      document.getElementById('zoom-in-btn').addEventListener('click', () => {
        const nextScale = Math.round((state.zoomScale + 0.20) * 20) / 20;
        animateZoomTo(nextScale);
      });

      document.getElementById('zoom-out-btn').addEventListener('click', () => {
        const nextScale = Math.round((state.zoomScale - 0.20) * 20) / 20;
        animateZoomTo(nextScale);
      });

      // 上一节点 / 下一节点
      document.getElementById('prev-event-btn').addEventListener('click', () => {
        const list = HISTORICAL_EVENTS.filter(ev =>
          state.activeCategory === 'all' || ev.category === state.activeCategory
        );
        if (!list.length) return;
        const idx = list.findIndex(e => e.id === state.selectedEventId);
        const prevIdx = idx > 0 ? idx - 1 : list.length - 1;
        selectHistoricalEvent(list[prevIdx].id, true);
      });

      document.getElementById('next-event-btn').addEventListener('click', () => {
        const list = HISTORICAL_EVENTS.filter(ev =>
          state.activeCategory === 'all' || ev.category === state.activeCategory
        );
        if (!list.length) return;
        const idx = list.findIndex(e => e.id === state.selectedEventId);
        const nextIdx = idx < list.length - 1 ? idx + 1 : 0;
        selectHistoricalEvent(list[nextIdx].id, true);
      });

      window.addEventListener('resize', () => {
        applyScrollTransform();
      });
    }

    // 启动初始化
    window.addEventListener('DOMContentLoaded', () => {
      renderQuickNav();
      initNavDragScroll();
      buildCanvasElementsOnce();
      updateCanvasLayout();
      initTimelineTouchAndPinch();
      initControls();

      // 初始展示三国起点（曹丕建魏）
      selectHistoricalEvent('e15', false);
      centerOnYear(235, false);
      scrollActiveNavIntoView('sanguo');
    });
  </script>
</body>
