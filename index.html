<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的应用中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f2f4f8;
      color: #1d1d1f;
      padding: 36px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px;
      color: #6e6e73;
    }
    .nav-list {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .nav-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 18px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: #1d1d1f;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .nav-card:active {
      transform: scale(0.98);
      background-color: #fafafa;
    }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card-title {
      font-size: 17px;
      font-weight: 600;
      color: #0066cc;
    }
    .card-file {
      font-size: 12px;
      color: #86868b;
      font-family: monospace;
    }
    .arrow {
      font-size: 18px;
      color: #c7c7cc;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 我的应用导航</h1>
    <p>点击下方卡片直接打开对应项目</p>
  </div>

  <div class="nav-list">
    <a class="nav-card" href="./chinese-currect-v1.0.html">
      <div class="card-info">
        <span class="card-title">中国历史 / 知识纠错 v1.0</span>
        <span class="card-file">chinese-currect-v1.0.html</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="nav-card" href="./chinese-dynasty.html">
      <div class="card-info">
        <span class="card-title">中国历代朝代演进</span>
        <span class="card-file">chinese-dynasty.html</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="nav-card" href="./k12(1).html">
      <div class="card-info">
        <span class="card-title">K12 教育学习应用</span>
        <span class="card-file">k12(1).html</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <a class="nav-card" href="./world-currect.html">
      <div class="card-info">
        <span class="card-title">世界历史 / 知识项目</span>
        <span class="card-file">world-currect.html</span>
      </div>
      <span class="arrow">›</span>
    </a>
  </div>

</body>
</html>
